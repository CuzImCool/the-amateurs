html,body{

/* PAWN CURSOR */
#amateurs-theme,#amateurs-theme *{
  cursor:none!important;
}
#amateurs-cursor{
  position:fixed!important;
  left:0;
  top:0;
  z-index:2147483647!important;
  pointer-events:none!important;
  display:none;
  font-size:25px;
  line-height:1;
  transform:translate(2px,2px);
  filter:drop-shadow(0 0 6px #a8ffdc);
}

/* MAIN THEME */
#amateurs-theme{
  box-sizing:border-box;
  width:100%;
  min-height:100vh;
  line-height:1.4;
  background:linear-gradient(145deg,#10251d,#172c25,#0a1712);
  color:#f2fff9;

/* HOVER EFFECTS */
#amateurs-theme a[data-hover-button],
#amateurs-theme button[data-hover-button]{
  transition:all .22s ease;
}
#amateurs-theme a[data-hover-button]:hover,
#amateurs-theme button[data-hover-button]:hover{
  transform:translateY(-2px) scale(1.02);
  filter:brightness(1.25);
  box-shadow:0 0 16px #8affd0,
             0 0 28px #8affd055;
  border-color:#d9fff0!important;
}
#amateurs-theme a[data-hover-button]:active,
#amateurs-theme button[data-hover-button]:active{
  transform:scale(.99);
}

/* PAWN RAIN */
#amateurs-theme .amateurs-rain{
  position:absolute;
  top:-40px;
  z-index:9999;
  pointer-events:none;
  animation:amateursFall linear forwards;
  line-height:1;
}
@keyframes amateursFall{
  0%{transform:translateY(-30px) rotate(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(750px) rotate(360deg);opacity:0}
}

#amateurs-theme .amateur-role{

#amateurs-theme .amateur-profile-name{

#amateurs-theme .amateur-profile-caption{

/* FOOTER LINKS */

  color:inherit;
  text-decoration:none;

</style>

<!-- PAWN CURSOR + CHESS.COM API -->
<script>
(function(){

var theme=document.getElementById('amateurs-theme');

/* PAWN CURSOR */
var cursor=document.createElement('span');
cursor.id='amateurs-cursor';
cursor.textContent='♟️';
document.body.appendChild(cursor);

document.addEventListener('mousemove',function(e){
  if(theme && theme.contains(e.target)){
    cursor.style.display='block';
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
  }else{
    cursor.style.display='none';
  }
});
document.addEventListener('mouseleave',function(){
  cursor.style.display='none';
});

/* ARNAV880 LIVE AVATAR */
var arnavImg=document.getElementById('arnav-avatar');
var arnavFallback=document.getElementById('arnav-fallback');

fetch('https://api.chess.com/pub/player/arnav880')
.then(function(response){
  if(!response.ok) throw new Error('Profile unavailable');
  return response.json();
})
.then(function(profile){
  if(profile.avatar){
    arnavImg.onload=function(){
      arnavImg.style.display='block';
      arnavFallback.style.display='none';
    };
    arnavImg.src=profile.avatar;
  }
})
.catch(function(){});

/* MEMBER COUNT */
function loadMemberCount(){
  var count=document.getElementById('amateurs-member-count');
  var status=document.getElementById('amateurs-member-status');
  var dot=document.getElementById('amateurs-member-dot');

  fetch('https://api.chess.com/pub/club/the-amatuers')
  .then(function(response){
    if(!response.ok) throw new Error('Club data unavailable');
    return response.json();
  })
  .then(function(club){
    if(typeof club.members_count==='number'){
      count.textContent=club.members_count.toLocaleString();
      status.textContent='Club count loaded';
      dot.style.background='#8affbd';
      dot.style.boxShadow='0 0 8px #8affbd';
    }else{
      throw new Error('Member count unavailable');
    }
  })
  .catch(function(){
    count.textContent='--';
    status.textContent='Member count unavailable';
    dot.style.background='#ff7777';
  });
}

/* TIME AGO */
function timeAgo(timestamp){
  var seconds=Math.max(0,Math.floor(Date.now()/1000-timestamp));
  if(seconds<60) return 'JUST NOW';

  var minutes=Math.floor(seconds/60);
  if(minutes<60) return minutes+' MINUTE'+(minutes===1?'':'S')+' AGO';

  var hours=Math.floor(minutes/60);
  if(hours<24) return hours+' HOUR'+(hours===1?'':'S')+' AGO';

  var days=Math.floor(hours/24);
  if(days<7) return days+' DAY'+(days===1?'':'S')+' AGO';

  var weeks=Math.floor(days/7);
  if(days<30) return weeks+' WEEK'+(weeks===1?'':'S')+' AGO';

  var months=Math.floor(days/30);
  if(days<365) return months+' MONTH'+(months===1?'':'S')+' AGO';

  var years=Math.floor(days/365);
  return years+' YEAR'+(years===1?'':'S')+' AGO';
}

/* NEWEST MEMBERS */
function loadNewestMembers(){
  var container=document.getElementById('amateurs-new-members');
  var status=document.getElementById('amateurs-new-members-status');

  fetch('https://api.chess.com/pub/club/the-amatuers/members')
  .then(function(response){
    if(!response.ok) throw new Error('Member list unavailable');
    return response.json();
  })
  .then(function(data){
    var members=[];

    ['weekly','monthly','all_time'].forEach(function(group){
      if(Array.isArray(data[group])){
        data[group].forEach(function(member){
          if(member.username && typeof member.joined==='number'){
            members.push(member);
          }
        });
      }
    });

    members.sort(function(a,b){
      return b.joined-a.joined;
    });

    var seen={};
    members=members.filter(function(member){
      var key=member.username.toLowerCase();
      if(seen[key]) return false;
      seen[key]=true;
      return true;
    });

    var newest=members.slice(0,3);
    container.innerHTML='';

    if(newest.length===0){
      container.innerHTML='<div class="new-members-status">No member data available.</div>';
      status.textContent='';
      return;
    }

    newest.forEach(function(member,index){
      var card=document.createElement('div');
      card.className='new-member-card';

      var avatarBox=document.createElement('div');
      avatarBox.className='new-member-avatar';
      avatarBox.textContent=member.username.charAt(0).toUpperCase();

      var info=document.createElement('div');
      info.className='new-member-info';

      var nameLink=document.createElement('a');
      nameLink.href='https://www.chess.com/member/'+encodeURIComponent(member.username);
      nameLink.target='_blank';
      nameLink.rel='noopener noreferrer';
      nameLink.className='profile-name-link';

      var name=document.createElement('div');
      name.className='new-member-name';
      name.textContent='@'+member.username;
      nameLink.appendChild(name);

      var date=document.createElement('div');
      date.className='new-member-date';
      date.textContent='JOINED '+timeAgo(member.joined);

      info.appendChild(nameLink);
      info.appendChild(date);

      var rank=document.createElement('div');
      rank.className='new-member-rank';
      rank.textContent='#'+(index+1);

      card.appendChild(avatarBox);
      card.appendChild(info);
      card.appendChild(rank);
      container.appendChild(card);

      /* LOAD AVATAR */
      fetch('https://api.chess.com/pub/player/'+encodeURIComponent(member.username))
      .then(function(response){
        if(!response.ok) throw new Error('Avatar unavailable');
        return response.json();
      })
      .then(function(profile){
        if(profile.avatar){
          var img=document.createElement('img');
          img.alt=member.username;
          img.src=profile.avatar;
          img.onerror=function(){
            avatarBox.textContent=member.username.charAt(0).toUpperCase();
          };
          avatarBox.textContent='';
          avatarBox.appendChild(img);
        }
      })
      .catch(function(){});
    });

    status.textContent='THE 3 MOST RECENTLY JOINED MEMBERS';
  })
  .catch(function(){
    container.innerHTML='<div class="new-members-status">Could not load members right now.</div>';
    status.textContent='Chess.com API unavailable';
  });
}

/* INITIAL LOAD */
loadMemberCount();
loadNewestMembers();

/* REFRESH EVERY 5 MINUTES */
setInterval(loadMemberCount,300000);
setInterval(loadNewestMembers,300000);

})();
</script>
