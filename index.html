#amateurs-theme .amateurs-rain{
  position:absolute;

  pointer-events:none;
  animation:amateursFall linear forwards;
  line-height:1;
  filter:drop-shadow(0 0 5px #ffffffaa);
}

  10%{opacity:1}
  90%{opacity:1}

}
